{% extends 'index.html' %}
{% block content %}
  <h2>Удалить рассылку</h2>
  <p>Вы уверены, что хотите удалить рассылку "{{ mailing.message.subject }}"?</p>
  <form method="post">{% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'mail_management_service:mailing-detail' mailing.pk %}">Отмена</a>
  </form>
{% endblock %}
